<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishEyeX | SOC Email Forensics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
              cyan: {
                400: '#22d3ee',
                500: '#06b6d4',
                900: '#164e63',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.4);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .glass-header {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }
        .soc-grid-bg {
            background-image: linear-gradient(rgba(51, 65, 85, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(51, 65, 85, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, #6366f1, transparent);
            animation: scan 2s linear infinite;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
    <!-- Polyfill for process.env -->
    <script>
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    
    <!-- STRICT IMPORT MAP -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
        "htm": "https://esm.sh/htm@3.1.1",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
        "@google/genai": "https://esm.sh/@google/genai"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="module">
      import React, { useState, useCallback, useEffect, useRef } from 'react';
      import { createRoot } from 'react-dom/client';
      import htm from 'htm';
      import { 
        Shield, Mail, Upload, AlertCircle, Terminal, Search, Trash2, Zap, File as FileIcon,
        AlertTriangle, CheckCircle, Info, ExternalLink, Activity, FileWarning, BookOpen, 
        Fingerprint, Globe, Link as LinkIcon, Hash, ListChecks, ShieldCheck, Flag, ArrowDown,
        Check, Target, Eye, BarChart3, Calendar, Copy, Server, Database,
        Wrench, Users, RefreshCw, ChevronRight, CheckSquare, Download, XCircle, LayoutDashboard,
        Network, Clock, Lock, Siren, Bug, Share2, ClipboardList, Filter, Box, Cpu, Wifi, HardDrive, Layers
      } from 'lucide-react';
      import { GoogleGenAI, Type } from '@google/genai';

      const html = htm.bind(React.createElement);

      // --- CONSTANTS & TYPES ---
      const Verdict = {
        BENIGN: 'BENIGN',
        SUSPICIOUS: 'SUSPICIOUS',
        MALICIOUS: 'MALICIOUS'
      };

      // --- GEMINI SERVICE ---
      async function analyzeEmail(content, attachmentNames = []) {
        const ANALYSIS_SCHEMA = {
          type: Type.OBJECT,
          properties: {
            verdict: { type: Type.STRING, enum: [Verdict.BENIGN, Verdict.SUSPICIOUS, Verdict.MALICIOUS] },
            confidence: { type: Type.NUMBER, description: "A score from 0 to 100 indicating certainty of the verdict." },
            justification: { type: Type.ARRAY, items: { type: Type.STRING } },
            executiveSummary: { type: Type.STRING },
            technicalSummary: { type: Type.STRING },
            attackType: { type: Type.STRING },
            campaignPattern: { type: Type.STRING },
            killChainStage: { type: Type.STRING },
            headers: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  label: { type: Type.STRING },
                  value: { type: Type.STRING },
                  securityMeaning: { type: Type.STRING },
                  isFlagged: { type: Type.BOOLEAN }
                },
                required: ["label", "value", "securityMeaning", "isFlagged"]
              }
            },
            receivedChain: { type: Type.ARRAY, items: { type: Type.STRING } },
            authentication: {
              type: Type.OBJECT,
              properties: {
                spf: { type: Type.OBJECT, properties: { status: { type: Type.STRING }, explanation: { type: Type.STRING } }, required: ["status", "explanation"] },
                dkim: { type: Type.OBJECT, properties: { status: { type: Type.STRING }, explanation: { type: Type.STRING } }, required: ["status", "explanation"] },
                dmarc: { type: Type.OBJECT, properties: { status: { type: Type.STRING }, explanation: { type: Type.STRING } }, required: ["status", "explanation"] }
              },
              required: ["spf", "dkim", "dmarc"]
            },
            ips: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  ip: { type: Type.STRING },
                  asn: { type: Type.STRING },
                  provider: { type: Type.STRING },
                  country: { type: Type.STRING },
                  riskProfile: { type: Type.STRING },
                  isSuspicious: { type: Type.BOOLEAN }
                }
              }
            },
            urls: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  original: { type: Type.STRING },
                  decoded: { type: Type.STRING },
                  domainAge: { type: Type.STRING },
                  flags: { type: Type.ARRAY, items: { type: Type.STRING } },
                  reputationScore: { type: Type.STRING },
                  isMalicious: { type: Type.BOOLEAN }
                }
              }
            },
            attachments: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  name: { type: Type.STRING },
                  declaredType: { type: Type.STRING },
                  realType: { type: Type.STRING },
                  size: { type: Type.STRING },
                  hashes: {
                    type: Type.OBJECT,
                    properties: {
                      md5: { type: Type.STRING },
                      sha1: { type: Type.STRING },
                      sha256: { type: Type.STRING }
                    }
                  },
                  threatIntel: { type: Type.STRING }
                }
              }
            },
            sandbox: {
              type: Type.OBJECT,
              properties: {
                simulatedBehavior: { type: Type.ARRAY, items: { type: Type.STRING }, description: "List of simulated actions the payload would take if executed (e.g., 'Spawns powershell.exe', 'Modifies Registry HKCU')." },
                networkActivity: { type: Type.ARRAY, items: { type: Type.STRING }, description: "Simulated network calls (e.g., 'DNS query to update.exe', 'POST to C2')." },
                fileSystemActivity: { type: Type.ARRAY, items: { type: Type.STRING }, description: "Simulated file system changes." },
                evasionTechniques: { type: Type.ARRAY, items: { type: Type.STRING }, description: "Detected evasion methods." }
              },
              required: ["simulatedBehavior", "networkActivity", "fileSystemActivity", "evasionTechniques"]
            },
            mitre: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  tactic: { type: Type.STRING },
                  technique: { type: Type.STRING },
                  id: { type: Type.STRING }
                }
              }
            },
            playbook: {
              type: Type.OBJECT,
              properties: {
                title: { type: Type.STRING },
                immediateActions: { type: Type.ARRAY, items: { type: Type.STRING } },
                detectionSteps: { type: Type.ARRAY, items: { type: Type.STRING } },
                remediationSteps: { type: Type.ARRAY, items: { type: Type.STRING } },
                recommendedTools: { type: Type.ARRAY, items: { type: Type.STRING } }
              },
              required: ["title", "immediateActions", "detectionSteps", "remediationSteps", "recommendedTools"]
            }
          },
          required: [
            "verdict", "confidence", "justification", "executiveSummary", "technicalSummary", 
            "attackType", "campaignPattern", "killChainStage", "headers", "receivedChain", 
            "authentication", "ips", "urls", "attachments", "sandbox", "mitre", "playbook"
          ]
        };

        const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
        
        const prompt = `
          Act as a Top-Tier SOC Malware Analyst and Sandbox Engineer.
          
          TASK: Perform a deep-dive forensic analysis and SIMULATED SANDBOX DETONATION of the provided email artifact.
          
          STRICT GUIDELINES FOR ACCURACY:
          1. **Headers**: Parse RFC 5322 headers strictly. Verify SPF/DKIM/DMARC by cross-referencing the "Received-SPF" and "Authentication-Results" headers. If absent, mark as "NONE".
          2. **Confidence Scoring (0-100)**:
             - 0-20: Clean, legitimate standard email (e.g., Newsletter).
             - 21-50: Suspicious but inconclusive (e.g., Marketing spam, broken auth).
             - 51-80: Highly Suspicious (e.g., Credential harvesting link, mismatched From/Return-Path).
             - 81-100: Confirmed Malicious (e.g., Known malware hash, C2 URL, Social Engineering with urgency).
          3. **Sandbox Simulation**:
             - Analyze the *intent* and *capabilities* of any links or attachments.
             - If a link points to a login page, simulate "Credential Harvesting" behavior.
             - If an attachment is a script/office doc, simulate "Process Injection" or "Command Execution".
             - Infer network traffic (e.g., "Connects to [domain] on port 443").
          4. **Verdict**: Be decisive. If it smells like phishing, call it MALICIOUS.
          
          RAW ARTIFACT:
          --- START ---
          ${content}
          --- END ---
          
          ATTACHMENTS: ${attachmentNames.join(", ") || "None"}
        `;

        try {
          const response = await ai.models.generateContent({
            model: "gemini-3-pro-preview",
            contents: prompt,
            config: {
              responseMimeType: "application/json",
              responseSchema: ANALYSIS_SCHEMA,
            },
          });

          const text = response.text;
          if (!text) throw new Error("Synthesis failed: Empty response from model.");
          return JSON.parse(text);
        } catch (err) {
          console.error("Forensic Engine Failure:", err);
          throw new Error(`Engine Failure: ${err.message}`);
        }
      }

      // --- UTILS ---
      const CopyButton = ({ text, className }) => {
        const [copied, setCopied] = useState(false);
        const handleCopy = (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(text);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
        };
        return html`
            <button onClick=${handleCopy} className=${`transition-all duration-200 hover:scale-110 ${className}`}>
                ${copied ? html`<${Check} className="w-3.5 h-3.5 text-emerald-400" />` : html`<${Copy} className="w-3.5 h-3.5 text-slate-500 hover:text-indigo-400" />`}
            </button>
        `;
      };

      // --- SUB-COMPONENTS ---
      
      const ThreatGauge = ({ score }) => {
        const radius = 30;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (score / 100) * circumference;
        let color = 'text-emerald-500';
        if(score > 50) color = 'text-amber-500';
        if(score > 80) color = 'text-rose-500';

        return html`
            <div className="relative w-24 h-24 flex items-center justify-center">
                <svg className="w-full h-full transform -rotate-90">
                    <circle cx="48" cy="48" r="${radius}" stroke="currentColor" strokeWidth="6" fill="transparent" className="text-slate-800" />
                    <circle cx="48" cy="48" r="${radius}" stroke="currentColor" strokeWidth="6" fill="transparent" strokeDasharray="${circumference}" strokeDashoffset="${offset}" className=${`transition-all duration-1000 ease-out ${color}`} />
                </svg>
                <div className="absolute flex flex-col items-center">
                    <span className="text-xl font-bold text-white">${score}</span>
                    <span className="text-[9px] uppercase font-bold text-slate-500">Risk</span>
                </div>
            </div>
        `;
      };

      const KillChainVisual = ({ stage }) => {
        const stages = ['Recon', 'Weaponization', 'Delivery', 'Exploitation', 'Installation', 'C2', 'Actions'];
        const currentIdx = stages.findIndex(s => stage.toLowerCase().includes(s.toLowerCase())) || 2; 

        return html`
            <div className="space-y-3">
                <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-500 px-1">
                    <span>Initiation</span>
                    <span>Impact</span>
                </div>
                <div className="flex gap-1 h-2">
                    ${stages.map((s, i) => html`
                        <div key=${i} className=${`flex-1 rounded-sm transition-all duration-500 ${i <= currentIdx ? 'bg-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.5)]' : 'bg-slate-800'}`} title=${s}></div>
                    `)}
                </div>
                <div className="flex justify-center">
                   <span className="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full text-xs font-bold uppercase tracking-wider">${stage}</span>
                </div>
            </div>
        `;
      };

      const SandboxTab = ({ sandbox }) => {
          return html`
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 h-full">
                <!-- PROCESS ACTIVITY -->
                <div className="glass-panel rounded-xl overflow-hidden flex flex-col">
                    <div className="p-4 border-b border-slate-800 bg-slate-900/80 flex items-center gap-2">
                        <${Cpu} className="w-4 h-4 text-amber-400" />
                        <h3 className="text-xs font-bold text-slate-200 uppercase tracking-widest">Process Activity</h3>
                    </div>
                    <div className="flex-1 p-4 bg-slate-950/30 font-mono text-xs space-y-3 overflow-y-auto">
                        ${sandbox.simulatedBehavior.length > 0 ? sandbox.simulatedBehavior.map((act, i) => html`
                            <div key=${i} className="flex items-start gap-2 text-slate-300">
                                <span className="text-amber-500 shrink-0">></span>
                                <span>${act}</span>
                            </div>
                        `) : html`<div className="text-slate-500 italic">No suspicious process activity simulated.</div>`}
                    </div>
                </div>

                <!-- NETWORK ACTIVITY -->
                <div className="glass-panel rounded-xl overflow-hidden flex flex-col">
                    <div className="p-4 border-b border-slate-800 bg-slate-900/80 flex items-center gap-2">
                        <${Wifi} className="w-4 h-4 text-cyan-400" />
                        <h3 className="text-xs font-bold text-slate-200 uppercase tracking-widest">Network Stream</h3>
                    </div>
                    <div className="flex-1 p-4 bg-slate-950/30 font-mono text-xs space-y-3 overflow-y-auto">
                        ${sandbox.networkActivity.length > 0 ? sandbox.networkActivity.map((act, i) => html`
                            <div key=${i} className="flex items-start gap-2 text-slate-300">
                                <span className="text-cyan-500 shrink-0">PKT_OUT ::</span>
                                <span>${act}</span>
                            </div>
                        `) : html`<div className="text-slate-500 italic">No anomalous network traffic detected.</div>`}
                    </div>
                </div>

                <!-- FILES & EVASION -->
                <div className="flex flex-col gap-6">
                    <div className="glass-panel rounded-xl overflow-hidden flex flex-col flex-1">
                        <div className="p-4 border-b border-slate-800 bg-slate-900/80 flex items-center gap-2">
                            <${HardDrive} className="w-4 h-4 text-emerald-400" />
                            <h3 className="text-xs font-bold text-slate-200 uppercase tracking-widest">File System</h3>
                        </div>
                        <div className="p-4 font-mono text-xs space-y-2">
                            ${sandbox.fileSystemActivity.length > 0 ? sandbox.fileSystemActivity.map((act, i) => html`
                                <div key=${i} className="text-slate-300 border-l-2 border-emerald-500/30 pl-2">${act}</div>
                            `) : html`<div className="text-slate-500 italic">No artifacts dropped.</div>`}
                        </div>
                    </div>
                    
                    <div className="glass-panel rounded-xl overflow-hidden flex flex-col flex-1">
                        <div className="p-4 border-b border-slate-800 bg-slate-900/80 flex items-center gap-2">
                            <${Layers} className="w-4 h-4 text-rose-400" />
                            <h3 className="text-xs font-bold text-slate-200 uppercase tracking-widest">Evasion Tactics</h3>
                        </div>
                        <div className="p-4 font-mono text-xs space-y-2">
                            ${sandbox.evasionTechniques.length > 0 ? sandbox.evasionTechniques.map((act, i) => html`
                                <div key=${i} className="flex items-center gap-2 text-rose-300 bg-rose-950/20 px-2 py-1 rounded">
                                    <${AlertTriangle} className="w-3 h-3" />
                                    ${act}
                                </div>
                            `) : html`<div className="text-slate-500 italic">No evasion techniques observed.</div>`}
                        </div>
                    </div>
                </div>
            </div>
          `;
      };

      const OverviewTab = ({ result }) => {
        return html`
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- LEFT COLUMN: SUMMARY -->
                <div className="lg:col-span-8 space-y-6">
                    <div className="glass-panel rounded-xl p-6 relative overflow-hidden group">
                        <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                            <${FileIcon} className="w-32 h-32 text-indigo-500" />
                        </div>
                        <div className="relative z-10">
                            <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4 flex items-center gap-2"><${Activity} className="w-4 h-4" /> Executive Analysis</h3>
                            <p className="text-lg text-slate-200 leading-relaxed font-light mb-6 border-l-4 border-indigo-500 pl-4 py-1">
                                ${result.executiveSummary}
                            </p>
                            <h4 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Technical Context</h4>
                            <p className="text-sm text-slate-400 font-mono leading-relaxed bg-slate-900/50 p-4 rounded-lg border border-slate-800/50">
                                ${result.technicalSummary}
                            </p>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                         <div className="glass-panel rounded-xl p-5">
                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Cyber Kill Chain</h3>
                            <${KillChainVisual} stage=${result.killChainStage} />
                         </div>
                         <div className="glass-panel rounded-xl p-5">
                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">MITRE ATT&CK TTPs</h3>
                            <div className="flex flex-wrap gap-2">
                                ${result.mitre.map((m, i) => html`
                                    <div key=${i} className="group relative">
                                        <div className="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-[10px] font-mono text-slate-300 cursor-help transition-colors">
                                            ${m.id}
                                        </div>
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 bg-slate-900 border border-slate-700 p-2 rounded text-[10px] text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 shadow-xl">
                                            <span className="font-bold text-indigo-400 block mb-0.5">${m.tactic}</span>
                                            ${m.technique}
                                        </div>
                                    </div>
                                `)}
                            </div>
                         </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN: INDICATORS -->
                <div className="lg:col-span-4 space-y-6">
                    <div className="glass-panel rounded-xl p-6 flex flex-col items-center justify-center text-center relative overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-b from-slate-900/0 to-slate-900/50 pointer-events-none"></div>
                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 w-full text-left">Threat Confidence</h3>
                        <${ThreatGauge} score=${result.confidence} />
                        <div className="mt-6 w-full space-y-3">
                            <div className="flex justify-between items-center text-sm p-3 bg-slate-900/50 rounded-lg border border-slate-800">
                                <span className="text-slate-400">Classification</span>
                                <span className="font-bold text-indigo-300">${result.attackType}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm p-3 bg-slate-900/50 rounded-lg border border-slate-800">
                                <span className="text-slate-400">Pattern</span>
                                <span className="font-bold text-slate-200 truncate max-w-[150px]">${result.campaignPattern}</span>
                            </div>
                        </div>
                    </div>

                    <div className="glass-panel rounded-xl p-0 overflow-hidden">
                         <div className="bg-slate-900/80 p-3 border-b border-slate-800 flex items-center justify-between">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Auth Status</h3>
                            <${Lock} className="w-3 h-3 text-slate-600" />
                         </div>
                         <div className="divide-y divide-slate-800/50">
                             ${Object.entries(result.authentication).map(([key, val], i) => {
                                const status = val.status || 'UNKNOWN';
                                const isPass = status.toLowerCase().includes('pass');
                                return html`
                                    <div key=${i} className="p-3 flex items-center justify-between">
                                        <span className="text-xs font-mono font-bold text-slate-300 uppercase">${key}</span>
                                        <span className=${`text-[10px] px-2 py-0.5 rounded font-black uppercase ${isPass ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}`}>${status}</span>
                                    </div>
                                `;
                             })}
                         </div>
                    </div>
                </div>
            </div>
        `;
      };

      const ForensicsTab = ({ result }) => {
        const [searchTerm, setSearchTerm] = useState('');
        
        const filteredHeaders = result.headers.filter(h => 
            h.label.toLowerCase().includes(searchTerm.toLowerCase()) || 
            h.value.toLowerCase().includes(searchTerm.toLowerCase())
        );

        return html`
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-280px)] min-h-[600px]">
                <!-- HEADER INSPECTOR -->
                <div className="lg:col-span-4 glass-panel rounded-xl flex flex-col overflow-hidden">
                    <div className="p-4 border-b border-slate-800 bg-slate-900/80 space-y-3">
                        <div className="flex items-center justify-between">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2"><${Search} className="w-3 h-3" /> Header Inspector</h3>
                            <span className="text-[10px] font-mono text-slate-600">${filteredHeaders.length} / ${result.headers.length}</span>
                        </div>
                        <div className="relative">
                            <input 
                                type="text"

                  <div className="relative group cursor-pointer">
                    <div className="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg blur opacity-40 group-hover:opacity-75 transition duration-200"></div>
                    <div className="relative bg-slate-950 p-2 rounded-lg border border-slate-800 flex items-center justify-center">
                        <${Shield} className="w-5 h-5 text-indigo-400" />
                    </div>
                  </div>
                  <div>
                    <h1 className="text-lg font-bold tracking-tight text-white leading-none">PhishEye<span className="text-indigo-500">X</span></h1>
                    <span className="text-[9px] font-mono text-slate-500 uppercase tracking-widest">Forensic Suite v4.2</span>
                  </div>
                </div>
                
                <div className="flex items-center gap-6">
                  ${!analysisResult && html`
                     <div className="hidden md:flex gap-6 text-[10px] font-mono font-bold text-slate-500 uppercase tracking-wider">
                        <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span> Engine Online</span>
                        <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.5)]"></span> Gemini 3 Pro</span>
                     </div>
                  `}
                  ${analysisResult && html`
                    <button onClick=${reset} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 border border-slate-700 hover:border-slate-600 transition-all shadow-lg">
                        <${Trash2} className="w-3.5 h-3.5" /> 
                        NEW SESSION
                    </button>
                  `}
                </div>
              </div>
            </header>

            <!-- MAIN CONTENT -->
            <main className="max-w-[1600px] mx-auto px-6 pt-24 pb-12 w-full">
              ${!analysisResult ? html`
                <div className="max-w-6xl mx-auto animate-fade-in pt-12">
                  <div className="text-center mb-16">
                    <h2 className="text-5xl md:text-6xl font-black mb-6 tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-white via-slate-200 to-slate-500 drop-shadow-2xl">
                        Intake Command Center
                    </h2>
                    <p className="text-slate-400 text-lg max-w-2xl mx-auto leading-relaxed font-light">
                        Initialize high-fidelity forensic analysis. Upload raw artifacts or paste headers to begin the kill chain reconstruction.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 h-[550px]">
                    <!-- DRAG DROP ZONE -->
                    <div className="lg:col-span-5 h-full">
                        <div 
                            onDragOver=${(e) => { e.preventDefault(); setIsDragging(true); }} 
                            onDragLeave=${() => setIsDragging(false)} 
                            onDrop=${onDrop} 
                            className=${`relative h-full glass-panel rounded-3xl border-2 border-dashed transition-all duration-300 flex flex-col items-center justify-center p-8 group cursor-pointer overflow-hidden ${isDragging ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700 hover:border-indigo-500/50 hover:bg-slate-900/80'}`}
                        >
                            ${!stagedFile ? html`
                                <div className="absolute inset-0 bg-gradient-to-br from-indigo-500/5 via-purple-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                <div className="relative z-10 text-center space-y-8">
                                    <div className="mx-auto w-24 h-24 bg-slate-950 rounded-full border border-slate-800 flex items-center justify-center group-hover:scale-110 transition-transform duration-500 shadow-[0_0_40px_-10px_rgba(99,102,241,0.3)]">
                                        <${Upload} className="w-10 h-10 text-indigo-400 group-hover:text-white transition-colors duration-300" />
                                    </div>
                                    <div className="space-y-2">
                                        <h3 className="font-bold text-2xl text-white tracking-tight">Upload Artifact</h3>
                                        <p className="text-sm text-slate-500 font-medium">Drag & Drop .eml, .msg, or .txt</p>
                                    </div>
                                    <label>
                                        <input type="file" className="hidden" onChange=${handleFileUpload} accept=".eml,.txt" />
                                        <span className="inline-block px-8 py-3.5 rounded-xl bg-white text-slate-950 font-bold text-sm shadow-[0_0_20px_rgba(255,255,255,0.2)] hover:shadow-[0_0_30px_rgba(255,255,255,0.4)] transition-all transform active:scale-95">Browse Files</span>
                                    </label>
                                </div>
                            ` : html`
                                <div className="text-center w-full animate-fade-in relative z-10">
                                    <div className="mx-auto w-20 h-20 bg-slate-950 rounded-2xl border border-slate-700 flex items-center justify-center mb-6 relative shadow-2xl">
                                        <${FileIcon} className="w-8 h-8 text-indigo-400" />
                                        <div className="absolute -top-2 -right-2 w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center border-4 border-slate-950 shadow-lg">
                                            <${Check} className="w-3 h-3 text-white" />
                                        </div>
                                    </div>
                                    <h4 className="font-bold text-xl text-white truncate max-w-xs mx-auto mb-1">${stagedFile.name}</h4>
                                    <p className="text-xs font-mono text-slate-500 mb-8 uppercase tracking-wider font-bold">${stagedFile.size} • READY FOR INGESTION</p>
                                    <button onClick=${() => setStagedFile(null)} className="text-xs font-bold text-rose-400 hover:text-white bg-rose-950/30 hover:bg-rose-500 px-4 py-2 rounded-lg border border-rose-900/50 hover:border-rose-500 transition-all flex items-center justify-center gap-2 mx-auto uppercase tracking-wide">
                                        <${XCircle} className="w-4 h-4" /> Remove Artifact
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>

                    <!-- TEXT EDITOR -->
                    <div className="lg:col-span-7 h-full flex flex-col glass-panel rounded-3xl overflow-hidden border border-slate-800 shadow-2xl">
                        <div className="bg-slate-950 p-4 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="flex gap-1.5">
                                    <div className="w-3 h-3 rounded-full bg-slate-800 border border-slate-700"></div>
                                    <div className="w-3 h-3 rounded-full bg-slate-800 border border-slate-700"></div>
                                </div>
                                <span className="text-xs font-mono text-slate-500 font-bold uppercase tracking-wider ml-2">Manual Input Buffer</span>
                            </div>
                            <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20">
                                <${Zap} className="w-3 h-3 text-indigo-400" />
                                <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">Live Stream</span>
                            </div>
                        </div>
                        <div className="relative flex-1">
                             <textarea 
                                className="absolute inset-0 w-full h-full bg-[#0b0f19] p-6 text-sm font-mono text-slate-300 resize-none focus:outline-none placeholder:text-slate-700 leading-relaxed custom-scrollbar" 
                                placeholder="// PASTE FORENSIC ARTIFACT HERE
// Supported formats: Raw Headers, Base64 Payloads, Forwarded Text..." 
                                value=${emailContent} 
                                onChange=${(e) => { setEmailContent(e.target.value); if (stagedFile) setStagedFile(null); }}
                                spellCheck="false"
                            ></textarea>
                        </div>
                    </div>
                  </div>

                  <!-- ACTION AREA -->
                  <div className="mt-12 flex flex-col items-center gap-6">
                    ${error && html`
                        <div className="animate-slide-up flex items-center gap-4 px-6 py-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 max-w-xl w-full shadow-[0_0_30px_-10px_rgba(244,63,94,0.2)]">
                            <div className="p-2 bg-rose-500/20 rounded-lg"><${AlertCircle} className="w-5 h-5" /></div>
                            <div>
                                <h4 className="text-xs font-bold uppercase tracking-wider mb-1">Ingestion Error</h4>
                                <p className="text-sm font-medium opacity-90">${error.message}</p>
                            </div>
                        </div>
                    `}
                    
                    ${isAnalyzing ? html`<${LoadingScreen} />` : html`
                        <button 
                            onClick=${runAnalysis} 
                            className="relative group px-16 py-6 rounded-2xl font-black text-xl tracking-tight transition-all duration-300 transform active:scale-95 bg-white text-slate-950 hover:bg-indigo-50 hover:text-indigo-900 shadow-[0_0_40px_-5px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_-5px_rgba(99,102,241,0.6)]"
                        >
                            <div className="flex items-center gap-4 relative z-10">
                                <${Search} className="w-6 h-6" />
                                <span>INITIATE ANALYSIS</span>
                            </div>
                        </button>
                    `}
                    <p className="text-[10px] text-slate-600 font-mono uppercase tracking-[0.2em] opacity-60">Powered by Google Gemini 3.0 Pro</p>
                  </div>
                </div>
              ` : html`
                <${AnalysisDashboard} result=${analysisResult} />
              `}
            </main>
          </div>
        `;
      };

      const container = document.getElementById('root');
      if (container) {
        const root = createRoot(container);
        root.render(html`<${App} />`);
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
